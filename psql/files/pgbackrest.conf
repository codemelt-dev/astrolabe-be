# /etc/pgbackrest/pgbackrest.conf (lab psql, step backups): the backup repository and WAL archiving.
# No secrets here: the S3 keys and the cipher pass are in conf.d/secrets.conf (root:postgres 0640),
# written from /etc/stellar/secrets; pgBackRest reads conf.d/*.conf after this file.
[global]
# Repository: an S3 bucket in another location than this server
repo1-type=s3
repo1-s3-endpoint=fsn1.your-objectstorage.com
repo1-s3-region=fsn1
repo1-s3-bucket=stellar-pgbackrest
repo1-s3-uri-style=host
repo1-path=/pgbackrest

# Retention (the last weekly full: up to a week of point-in-time recovery) and client-side encryption
repo1-retention-full=1
repo1-cipher-type=aes-256-cbc

# Repository format: bundle small files; block-level incremental for large relation files
repo1-bundle=y
repo1-block=y

# Throughput
compress-type=zst
process-max=4
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
# If the repository is unreachable, WAL queues up in pg_wal. Past this size pgBackRest drops WAL
# (breaking point-in-time recovery until the next backup) rather than letting the disk fill up.
archive-push-queue-max=256GiB

log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[explorer]
pg1-path=/var/lib/postgresql/18/main
