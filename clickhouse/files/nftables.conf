#!/usr/sbin/nft -f
# /etc/nftables.conf (lab clickhouse, step firewall): the whole ruleset of the clickhouse host,
# default drop. SSH from the admin IPs; from the psql host on the private interface, ClickHouse over
# TLS and the metrics. ClickHouse's plain ports (8123, 9000) stay on loopback.
flush ruleset

define ADMIN   = { 203.0.113.10 }
define PRIV_IF = "enp5s0.4000"
define PSQL    = 10.0.1.2

table inet stellar {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif "lo" accept

		# Path-MTU discovery (the VLAN's MTU is 1400) and IPv6 neighbour discovery need ICMP.
		meta l4proto { icmp, ipv6-icmp } accept
		# DHCP replies, where the provider configures an interface by DHCP.
		udp sport 67 udp dport 68 accept

		ip saddr $ADMIN tcp dport 22 accept
		# 8443 HTTPS and 9440 native TLS (Grafana, later Caddy); 9363 ClickHouse metrics,
		# 9100 node_exporter, 9103 the pipeline's /metrics (Prometheus).
		iifname $PRIV_IF ip saddr $PSQL tcp dport { 8443, 9440, 9363, 9100, 9103 } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
