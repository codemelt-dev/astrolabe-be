#!/usr/sbin/nft -f
# /etc/nftables.conf (lab psql, step firewall): the whole ruleset of the psql host, default drop.
# HTTP(S) from anyone, SSH from the admin IPs, PostgreSQL only from the galexie host on the private
# interface. Everything else that listens here is on loopback.
flush ruleset

define ADMIN   = { 203.0.113.10 }
define PRIV_IF = "enp5s0.4000"
define GALEXIE = 10.0.0.2

table inet stellar {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif "lo" accept

		# Path-MTU discovery (the VLAN's MTU is 1400) and IPv6 neighbour discovery need ICMP.
		meta l4proto { icmp, ipv6-icmp } accept
		# DHCP replies, where the provider configures an interface by DHCP.
		udp sport 67 udp dport 68 accept

		ip saddr $ADMIN tcp dport 22 accept
		tcp dport { 80, 443 } accept
		udp dport 443 accept
		iifname $PRIV_IF ip saddr $GALEXIE tcp dport 5432 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
