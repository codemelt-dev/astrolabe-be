# /etc/needrestart/conf.d/60-stellar-docker.conf (lab galexie, step system): after library
# updates, needrestart lists Docker and the stellar units but never restarts them. A docker or
# containerd restart kills Galexie's container, an unclean stop that costs a captive-core
# rebuild; the worker is a static binary (galexie/README.md §7.4.18).
$nrconf{override_rc}{qr(^docker)} = 0;
$nrconf{override_rc}{qr(^containerd)} = 0;
$nrconf{override_rc}{qr(^stellar-)} = 0;
