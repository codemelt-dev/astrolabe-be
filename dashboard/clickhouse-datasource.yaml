# /etc/grafana/provisioning/datasources/stellar-clickhouse.yaml (lab psql, step grafana, when
# clickhouse_hostname is set): the clickhouse host's ClickHouse, as stellar_reader (read only, its
# own profile and quota) over native TLS on the private network, trusting only lab's CA for it.
# Read at Grafana's start.
apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    editable: false
    jsonData:
      host: 10.0.2.2
      port: 9440
      protocol: native
      secure: true
      tlsAuthWithCACert: true
      username: stellar_reader
      defaultDatabase: stellar
      # The plugin sends max_execution_time with every query; above the reader profile's limit
      # (60 s, clickhouse/files/stellar-users.xml) ClickHouse refuses the query. 30 s, the profile's
      # default.
      queryTimeout: "30"
      dialTimeout: "10"
    secureJsonData:
      password: $__file{/etc/grafana/clickhouse-reader.password}
      tlsCACert: $__file{/etc/stellar/clickhouse-ca.crt}
