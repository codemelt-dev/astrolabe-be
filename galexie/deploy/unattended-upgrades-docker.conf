// /etc/apt/apt.conf.d/51stellar-docker (lab galexie, step docker): a dockerd restart kills
// Galexie's container, so Docker is never upgraded unattended (unattended-upgrades only uses
// Ubuntu's origins anyway; this makes it explicit). Upgrade it by hand with Galexie held
// (galexie/README.md §7.4.18).
Unattended-Upgrade::Package-Blacklist { "docker-ce"; "docker-ce-cli"; "docker-ce-rootless-extras"; "containerd.io"; };
