# /etc/sysctl.d/60-stellar.conf (lab psql, step postgres): kernel settings for PostgreSQL.
# Bind the private IP even before its interface is up, so the cluster never starts on localhost only.
net.ipv4.ip_nonlocal_bind = 1
# 2 MB huge pages for shared_buffers and its overhead; computed from RAM (shown here for 128 GB).
vm.nr_hugepages = 17200
