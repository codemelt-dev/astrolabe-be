# /etc/postgrest/postgrest.conf (lab psql, step postgrest): PostgREST, the API server. No secrets:
# it logs in over the Unix socket as authenticator, by peer authentication (pg_ident.conf).

## Database
db-uri = "postgres://authenticator@/explorer?host=/var/run/postgresql"
db-schemas = "api"
db-anon-role = "web_anon"
db-extra-search-path = ""                 # every name in the api schema is schema-qualified
db-max-rows = 200                         # hard cap per response; larger ?limit= values are cut to 200
db-pool = 20                              # of max_connections = 100 (10-listen-tls.conf)
db-pool-acquisition-timeout = 5           # seconds a request waits for a connection, then 504
# db-config also loads web_anon's role settings, its 2 s statement_timeout among them: keep it on.
db-config = true
db-channel-enabled = true                 # LISTEN pgrst: api.sql's NOTIFY reloads the schema cache
db-plan-enabled = false                   # no EXPLAIN output for clients
db-aggregates-enabled = false             # no count()/sum() over arbitrary columns

## Server: only Caddy talks to it
server-host = "127.0.0.1"
server-port = 3000
admin-server-host = "127.0.0.1"
admin-server-port = 3001                  # /live, /ready, /metrics

## API behaviour
openapi-mode = "follow-privileges"        # the OpenAPI document at / lists what web_anon may read
openapi-server-proxy-uri = "https://api.example.com"
server-cors-allowed-origins = "https://explorer.example.com"
client-error-verbosity = "minimal"        # error code and message, no SQL details or hints
url-use-legacy-target-names = false

## Logging (to the journal); Caddy keeps the access log
log-level = "error"
