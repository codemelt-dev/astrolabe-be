# /etc/postgresql/18/main/conf.d/20-tuning.conf (lab psql, step postgres): settings for ingest and the API.
# lab psql computes the memory, parallelism and WAL sizes from this host's RAM, cores and data
# volume (README §6.4); this copy shows them for 128 GB RAM, 16 cores (32 threads) and 3.84 TB.

# Memory
shared_buffers = '32GB'                   # 25 % of RAM, in huge pages (vm.nr_hugepages)
huge_pages = 'try'                        # SHOW huge_pages_status says whether they are used
effective_cache_size = '90GB'             # planner hint: 70 % of RAM, 4 GB left for the rest
work_mem = '64MB'                         # per sort or hash node; API queries are small
maintenance_work_mem = '2GB'              # CREATE INDEX, manual VACUUM
autovacuum_work_mem = '1GB'               # per autovacuum worker

# I/O: asynchronous I/O speeds up reads (API scans, VACUUM), not ingest writes
io_method = 'worker'                      # the default; io_uring would need a restart to try
io_workers = 8
effective_io_concurrency = 64
maintenance_io_concurrency = 64
random_page_cost = 1.1                    # NVMe

# Parallelism
max_worker_processes = 32
max_parallel_workers = 16
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# WAL and checkpoints: ingest throughput depends on these and on COPY batching
wal_level = 'replica'                     # WAL archiving needs it
wal_compression = 'zstd'
wal_buffers = '64MB'
max_wal_size = '64GB'                     # 1/16 of the data volume, at most 64 GB
min_wal_size = '4GB'
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9

# Autovacuum: append-only history partitions (insert-triggered vacuums keep the visibility
# map current for index-only scans) and update-heavy current-state tables
autovacuum_max_workers = 6
autovacuum_naptime = '30s'
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_scale_factor = 0.05
autovacuum_vacuum_insert_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Planner and locks
jit = off                                 # short API queries: compiling only adds latency
max_locks_per_transaction = 256           # a query locks every unpruned partition and its indexes
default_toast_compression = 'lz4'         # faster than pglz for the XDR columns

# Observability
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = 'top'
track_io_timing = on
track_wal_io_timing = on
log_min_duration_statement = '1s'
log_autovacuum_min_duration = '30s'
log_lock_waits = on
log_temp_files = '64MB'
