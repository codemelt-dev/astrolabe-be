# /etc/postgresql/18/main/conf.d/30-archive.conf (lab psql, step postgres): WAL archiving to the
# pgBackRest repository (step backups). archive_mode needs a restart; it is set before the first start.
archive_mode = on
archive_command = 'pgbackrest --stanza=explorer archive-push %p'
archive_timeout = '5min'                  # bounds data loss when the database is idle
