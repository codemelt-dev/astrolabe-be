# /etc/systemd/system/grafana-server.service.d/20-public.conf (lab psql, step grafana, when
# grafana_hostname is set): Grafana's public URL behind Caddy (psql/files/grafana.caddy), over
# grafana.ini's loopback one. Its cookies then need HTTPS; the SSH tunnel stays usable
# (csrf_trusted_origins in grafana.ini, and browsers treat localhost as secure).
[Service]
Environment=GF_SERVER_DOMAIN=grafana.example.com
Environment=GF_SERVER_ROOT_URL=https://grafana.example.com/
Environment=GF_SECURITY_COOKIE_SECURE=true
