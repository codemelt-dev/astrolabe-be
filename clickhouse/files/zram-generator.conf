# /etc/systemd/zram-generator.conf (lab clickhouse, step system): swap compressed in RAM.
# Half of the RAM, at most 4 GB of pages, which take about a third of that once compressed.
# Its priority (100, the default) puts it ahead of any swap on disk.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
