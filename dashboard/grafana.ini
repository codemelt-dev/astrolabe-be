# /etc/grafana/grafana.ini (lab psql, step grafana): Grafana on loopback, reached through an SSH
# tunnel like Prometheus (psql/README.md), or through Caddy when grafana_hostname is set
# (grafana-public.conf). Everything not set here is Grafana's default
# (/usr/share/grafana/conf/defaults.ini). Grafana takes no comments after a value.

[server]
# 3000 and 3001 are PostgREST's.
http_addr = 127.0.0.1
http_port = 3002
domain = localhost
root_url = http://localhost:3002/

[security]
admin_user = admin
# Read when Grafana creates its database, i.e. on the first start only; afterwards lab sets
# it back with `grafana cli admin reset-admin-password` whenever it changed (dashboard/README.md).
admin_password = $__file{/etc/grafana/admin-password}
disable_gravatar = true
cookie_samesite = strict
# Logins through the SSH tunnel while a public hostname is set (dashboard/grafana-public.conf).
csrf_trusted_origins = localhost:3002

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/stellar-explorer/pipeline.json

[log]
# To the journal: journalctl -u grafana-server
mode = console
