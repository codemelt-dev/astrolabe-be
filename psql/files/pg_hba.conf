# /etc/postgresql/18/main/pg_hba.conf (lab psql, step postgres): who may log in, from where, how.
# TYPE   DATABASE  USER                          ADDRESS          METHOD

# Administration (runuser -u postgres -- psql) and pgBackRest
local    all       postgres                                       peer
# PostgREST: the OS user postgrest logs in as authenticator (pg_ident.conf), no password
local    explorer  authenticator                                  peer map=postgrest
# postgres_exporter: the OS user prometheus logs in as postgres_exporter
local    all       postgres_exporter                              peer map=exporter
# worker state-copy: the OS user stellar logs in as state_reader (read only)
local    explorer  state_reader                                   peer map=statecopy
# The galexie host: ingest, bootstrap, reindex (ingest_writer) and worker migrate (explorer_owner)
hostssl  explorer  ingest_writer,explorer_owner  10.0.0.2/32      scram-sha-256

# Everything else is rejected
local    all       all                                            reject
host     all       all                           0.0.0.0/0        reject
host     all       all                           ::/0             reject
