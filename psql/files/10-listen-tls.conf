# /etc/postgresql/18/main/conf.d/10-listen-tls.conf (lab psql, step postgres): listeners and TLS.
listen_addresses = 'localhost,10.0.1.2'   # never the public interface
port = 5432
max_connections = 100

# The server certificate is issued by the local CA (/etc/stellar/pg-ca.crt) with the private IP in its
# SAN, so the galexie host connects with sslmode=verify-full.
ssl = on
ssl_cert_file = '/etc/ssl/postgresql/server.crt'
ssl_key_file = '/etc/ssl/postgresql/server.key'
ssl_min_protocol_version = 'TLSv1.3'      # pgx and libpq on the galexie host speak TLS 1.3
password_encryption = 'scram-sha-256'

log_connections = 'authorization'         # one line per login: role, database, TLS
