# /etc/prometheus/rules/alerts.yml (lab psql, step monitoring): alert rules for this host and the
# monitoring itself; the galexie host's are in galexie-alerts.yml. Runbooks: README §8.6.
# severity: page (wake someone), warning (look during working hours), heartbeat (Watchdog only).
groups:
  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up{job="postgres"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: PostgreSQL is not accepting connections from postgres_exporter

      - alert: PostgresWalArchivingFailing
        expr: increase(pg_stat_archiver_failed_count{job="postgres"}[15m]) > 0
        for: 15m
        labels: {severity: page}
        annotations:
          summary: 'archive_command keeps failing: WAL piles up in pg_wal (see /var/log/pgbackrest)'

      - alert: PostgresWalArchiveStale
        expr: pg_stat_archiver_last_archive_age{job="postgres"} > 900
        for: 5m
        labels: {severity: page}
        annotations:
          summary: No WAL segment archived for 15 minutes (archive_timeout is 5 minutes)

      - alert: PostgresBackupStale
        expr: time() - max(pgbackrest_last_success_timestamp_seconds{job="node"}) > 30 * 3600 and on() max(node_systemd_unit_state{job="node", name="pgbackrest-diff.timer", state="active"}) == 1
        labels: {severity: page}
        annotations:
          summary: No successful pgBackRest backup for 30 hours, with the daily diff timer on

      - alert: PostgresBackupMetricMissing
        expr: absent(pgbackrest_last_success_timestamp_seconds{job="node"})
        for: 8d
        labels: {severity: page}
        annotations:
          summary: No pgBackRest backup has ever been recorded

      - alert: PostgresFullBackupStale
        expr: time() - pgbackrest_last_success_timestamp_seconds{job="node", type="full"} > 8 * 86400
        labels: {severity: page}
        annotations:
          summary: No successful full backup for 8 days (one runs every Sunday)

      - alert: PostgresBackupUnitFailed
        expr: node_systemd_unit_state{job="node", name=~"pgbackrest-backup@.+", state="failed"} == 1
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.name }} failed (journalctl -u {{ $labels.name }})'

      - alert: PostgresLongRunningTransaction
        expr: max(pg_stat_activity_max_tx_duration{job="postgres", state=~"active|idle in transaction.*"}) > 600
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: A transaction has been open for over 10 minutes (it holds back vacuum)

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count{job="postgres"}) / max(pg_settings_max_connections{job="postgres"}) > 0.8
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: More than 80 % of max_connections in use

  - name: host
    rules:
      - alert: TargetDown
        expr: up{job=~"node|postgres|postgrest|caddy|alertmanager"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: '{{ $labels.job }} on the psql host cannot be scraped'

      - alert: DataDiskUsage
        expr: 1 - node_filesystem_avail_bytes{job="node", mountpoint="/var/lib/postgresql"} / node_filesystem_size_bytes{job="node", mountpoint="/var/lib/postgresql"} > 0.70
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: '/var/lib/postgresql is {{ $value | humanizePercentage }} full: plan the growth'

      - alert: DataDiskCritical
        expr: 1 - node_filesystem_avail_bytes{job="node", mountpoint="/var/lib/postgresql"} / node_filesystem_size_bytes{job="node", mountpoint="/var/lib/postgresql"} > 0.85
        for: 5m
        labels: {severity: page}
        annotations:
          summary: '/var/lib/postgresql is {{ $value | humanizePercentage }} full'

      - alert: DataDiskFullIn30Days
        expr: predict_linear(node_filesystem_avail_bytes{job="node", mountpoint="/var/lib/postgresql"}[7d], 30 * 86400) < 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: At the last 7 days' growth, /var/lib/postgresql fills up within 30 days

      - alert: RootDiskUsage
        expr: 1 - node_filesystem_avail_bytes{job="node", mountpoint="/"} / node_filesystem_size_bytes{job="node", mountpoint="/"} > 0.85
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: '/ is {{ $value | humanizePercentage }} full (logs, pgBackRest spool, Prometheus data)'

      - alert: RaidDegraded
        expr: (node_md_disks_required{job="node"} - ignoring(state) node_md_disks{job="node", state="active"}) > 0 or node_md_disks{job="node", state="failed"} > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: 'RAID array {{ $labels.device }} is degraded: replace the drive'

  - name: api
    rules:
      - alert: ApiServerErrors
        expr: |
          sum(rate(caddy_http_request_duration_seconds_count{job="caddy", code=~"5.."}[5m]))
            / sum(rate(caddy_http_request_duration_seconds_count{job="caddy"}[5m])) > 0.05
        for: 10m
        labels: {severity: page}
        annotations:
          summary: 'More than 5 % of API responses are 5xx (PostgREST down, database unreachable, or timeouts)'

      - alert: ApiRateLimitedShare
        expr: |
          sum(rate(caddy_http_request_duration_seconds_count{job="caddy", code="429"}[15m]))
            / sum(rate(caddy_http_request_duration_seconds_count{job="caddy"}[15m])) > 0.10
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'More than 10 % of API requests are rate limited: abuse, or the limit needs tuning'

      - alert: PostgrestPoolTimeouts
        expr: increase(pgrst_db_pool_timeouts_total{job="postgrest"}[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Requests waited longer than db-pool-acquisition-timeout for a database connection

      - alert: PostgrestSchemaCacheFailing
        expr: increase(pgrst_schema_cache_loads_total{job="postgrest", status="FAIL"}[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: PostgREST could not reload its schema cache (it keeps serving the old one)

  - name: monitoring
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: heartbeat}
        annotations:
          summary: Always firing. Alertmanager forwards it to the external dead-man's switch, which pages when it stops.

      - alert: PrometheusRuleFailures
        expr: increase(prometheus_rule_evaluation_failures_total{job="prometheus"}[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: Some alert rules fail to evaluate

      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total{job="alertmanager"}[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: 'Alertmanager cannot deliver to {{ $labels.integration }}'
